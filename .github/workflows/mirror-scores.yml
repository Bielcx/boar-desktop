name: Mirror scores to Hugging Face

# Optional, off by default: does nothing until the HF_DATASET variable is set. Once a day,
# copies the public (approved) scores to that Hugging Face dataset, reading with the publishable
# key only. Needs the HF_TOKEN secret (a fine-grained token with write access to that dataset)
# and the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY variables.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    if: vars.HF_DATASET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/mirror-scores-hf.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
