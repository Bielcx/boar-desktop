name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; actions pinned to a commit (the tag in the comment).
permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop:
    # Both systems the app ships for: npm installs each one's native packages (node-llama-cpp, whisper).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # The shims and tests import the app's packages from the root. Types and JS only: skip
      # llama.rn's postinstall, which downloads the Android/iOS binaries.
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
