name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop:
    # desktop/ pins Windows x64 native packages (node-llama-cpp, whisper), so it runs on Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # The shims and tests import the app's packages from the root. Types and JS only: skip
      # llama.rn's postinstall, which downloads the Android/iOS binaries.
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
